<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euclidean Invoice Generator</title>

  <style>
    :root {
      --accent: #a22a2a; /* Deep Euclidean-ish red */
      --accent2: rgba(139, 30, 30, 0.12);
      --muted: #666;
      --border: #e6e6e6;
      --bg: #fafafa;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      color: #111;
    }

    * { box-sizing: border-box; }
    .panel { min-width: 0; }
    .app {
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      background: #fcfcfc;
    }

    .panel .content { padding: 12px 14px; }

    textarea {
      width: 100%;
      height: 420px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.35;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 650;
    }

    button.primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
    }

    button:active { transform: translateY(1px); }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    .error {
      color: #b00020;
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 10px;
    }

    .warning {
      color: #8b1e1e;
      background: rgba(139, 30, 30, 0.08);
      border: 1px solid rgba(139, 30, 30, 0.22);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    /* Invoice sheet */
    .sheetWrap { padding: 12px; overflow: auto; }
    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 18px rgba(0,0,0,.06);
      padding: 18mm 16mm;
      box-sizing: border-box;
      position: relative;
    }

    /* The scar */
    .sheet::before {
      content: "";
      display: block;
      height: 3px;
      background: linear-gradient(to right, var(--accent), transparent);
      margin: -18mm -16mm 12mm -16mm;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .brand { display: flex; gap: 12px; align-items: center; }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 1px 10px rgba(0,0,0,.04);
    }

    .logo img { width: 100%; height: 100%; object-fit: contain; }

    .title {
      font-size: 24px;
      letter-spacing: .2px;
      margin: 0;
      color: var(--accent);
    }

    .meta { text-align: right; }
    .meta .k { color: var(--muted); font-size: 12px; }
    .meta .v { font-weight: 800; color: var(--accent); }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .box h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .box .line { font-size: 13px; line-height: 1.4; }
    .muted { color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      vertical-align: top;
    }

    th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    td { font-size: 13px; }
    .num { text-align: right; white-space: nowrap; }
    .desc { width: 52%; }

    .totals { margin-top: 14px; display: flex; justify-content: flex-end; }

    .totalsBox {
      width: 72mm;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #f5f5f5;
    }

    .totalsRow {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
    }

    .totalsRow.big {
      font-weight: 900;
      font-size: 15px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 10px;
    }

    .totalsRow.big span:last-child { color: var(--accent); }

    .footer {
      margin-top: 18px;
      display: grid;
      gap: 16px;
    }

    .footerRow {
      display: grid;
      grid-template-columns: 1fr 160px;
      gap: 16px;
      align-items: start;
    }

    .footerLeft {
      display: grid;
      gap: 16px;
    }

    .small { font-size: 12px; line-height: 1.4; }

    .qrBox {
      width: 140px;
      height: 140px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .qrCaption {
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    .ipsString {
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      word-break: break-all;
      text-align: center;
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(139,30,30,0.06);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .app { grid-template-columns: minmax(0, 1fr); padding: 8px; }
      textarea { height: 300px; font-size: 16px; }
    }
    @page { size: A4; margin: 10mm; }
    @media print {
      tr, .box, .totalsBox, .top { break-inside: avoid; }
      thead { display: table-header-group; }
      .sheetWrap { overflow: visible; }
      .ipsString { display: none; }
      body { background: #fff; }
      .app { display: block; padding: 0; }
      .panel.editor { display: none; }
      .panel.preview {
        display: block;
        border: none;
        border-radius: 0;
      }
      .panel.preview h2 { display: none; }
      .sheetWrap { padding: 0; }
      .sheet {
        border: none;
        border-radius: 0;
        box-shadow: none;
        margin: 0;
        width: auto;
        min-height: auto;
        padding: 16mm 14mm;
      }
      .sheet::before {
        margin: -16mm -14mm 12mm -14mm;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel editor">
      <h2>Invoice JSON</h2>
      <div class="content">
        <textarea id="json" aria-label="Invoice JSON" spellcheck="false"></textarea>
        <div class="row">
          <button class="primary" id="renderBtn">Render</button>
          <button id="pdfBtn">Download PDF</button>
          <button id="sampleBtn">Load Sample</button>
        </div>
        <div class="hint">
          Notes: Seller + logo are hardcoded. PDF uses the browser print dialog for selectable text. IPS QR is generated for RSD only.
        </div>
        <div class="warning" id="protocolWarning" hidden></div>
        <div class="error" id="err" role="alert"></div>
      </div>
    </div>

    <div class="panel preview">
      <h2>Preview</h2>
      <div class="sheetWrap">
        <div class="sheet" id="sheet"></div>
      </div>
    </div>
  </div>

<script src="qrcode.js"></script>
<script>
  const $ = (id) => document.getElementById(id);

  // Hardcoded invariants
  const DEFAULTS = {
    seller: {
      company_name: "Euclidean Studios DOO Beograd",
      address_lines: [
        "Partizanske Avijacije 19",
        "11070 Novi Beograd, Serbia"
      ],
      tax_id: "PIB 114224573",
      registration_id: "MB 21990663",
      phone: "+381 64 100 7006",
      email: "euclideanstudios@gmail.com",
      website: "",
      bank: {
        beneficiary: "Euclidean Studios DOO Beograd",
        bank_name: "",
        iban: "",
        swift: "",
        account_no_rsd: "325-9500700211227-21",
        account_no_eur: "325-9601700085970-91",
        bank_address: ""
      }
    },
    branding: {
      accent: "#8b1e1e",
      logo_path: "NazSkull.webp"
    },
    invoice: {
      notes: "Thank you for your business."
    }
  };

  function deepMerge(a, b) {
    if (!b) return structuredClone(a);
    const out = Array.isArray(a) ? [...a] : { ...a };
    for (const [k, v] of Object.entries(b)) {
      if (v && typeof v === "object" && !Array.isArray(v) && typeof out[k] === "object" && out[k] && !Array.isArray(out[k])) {
        out[k] = deepMerge(out[k], v);
      } else {
        out[k] = v;
      }
    }
    return out;
  }

  function esc(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  function money(n, ccy) {
    const x = Number(n || 0);
    return new Intl.NumberFormat(undefined, { style: "currency", currency: ccy || "EUR" }).format(x);
  }

  function parseInvoiceDate(dateString) {
    if (typeof dateString !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(dateString)) return null;
    const parsed = new Date(dateString + "T00:00:00Z");
    return Number.isNaN(parsed.getTime()) || parsed.toISOString().slice(0, 10) !== dateString ? null : parsed;
  }

  function validateInvoice(doc) {
    if (!doc || typeof doc !== "object" || Array.isArray(doc)) throw new Error("Invoice JSON must be an object.");
    if (!Array.isArray(doc.line_items) || !doc.line_items.length) throw new Error("line_items must contain at least one item.");
    const numeric = (value, label) => {
      if (typeof value !== "number" || !Number.isFinite(value) || value < 0) throw new Error(label + " must be a finite, non-negative number.");
    };
    doc.line_items.forEach((it, i) => {
      if (!it || typeof it !== "object") throw new Error(`line_items[${i}] must be an object.`);
      numeric(it.qty, `line_items[${i}].qty`);
      numeric(it.unit_price, `line_items[${i}].unit_price`);
      numeric(it.tax_rate ?? 0, `line_items[${i}].tax_rate`);
      if (it.qty === 0) throw new Error(`line_items[${i}].qty must be greater than zero.`);
      if ((it.tax_rate ?? 0) > 1) throw new Error("tax_rate must be a fraction, e.g. 0.20 for 20%.");
    });
    for (const name of ["discount", "shipping"]) numeric(doc.totals?.[name] ?? 0, `totals.${name}`);
    if (doc.totals?.tax_included != null && typeof doc.totals.tax_included !== "boolean") throw new Error("tax_included must be true or false.");
    for (const party of ["seller", "buyer"]) {
      if (doc[party]?.address_lines != null && !Array.isArray(doc[party].address_lines)) throw new Error(party + ".address_lines must be an array.");
    }
    const ccy = doc.invoice?.currency ?? "EUR";
    if (typeof ccy !== "string" || !/^[A-Z]{3}$/i.test(ccy)) throw new Error("currency must be a three-letter code, e.g. EUR or RSD.");
    for (const name of ["issue_date", "due_date"]) {
      if (doc.invoice?.[name] && !parseInvoiceDate(doc.invoice[name])) throw new Error(name + " must be a valid YYYY-MM-DD date.");
    }
    if (doc.invoice?.issue_date && doc.invoice?.due_date && doc.invoice.due_date < doc.invoice.issue_date) throw new Error("due_date cannot precede issue_date.");
    const totals = computeTotals(doc);
    if (![totals.sub, totals.tax, totals.grand].every(Number.isFinite) || totals.discount > totals.sub) throw new Error("Invalid totals: check amounts and discount.");
  }

  function roundMoney(n, ccy = "EUR") {
    const digits = new Intl.NumberFormat("en", { style: "currency", currency: ccy }).resolvedOptions().maximumFractionDigits;
    const scale = 10 ** digits;
    return Math.round((n + Number.EPSILON) * scale) / scale;
  }

  function formatDueMessage(invoice) {
    const startDate = parseInvoiceDate(invoice?.issue_date);
    const dueDate = parseInvoiceDate(invoice?.due_date);
    if (!startDate || !dueDate) return "";
    const msPerDay = 24 * 60 * 60 * 1000;
    const dayDiff = Math.ceil((dueDate - startDate) / msPerDay);
    return `Payment due in ${dayDiff} days.`;
  }

  function mergeNotesWithDue(notes, dueMessage) {
    if (!dueMessage) return notes;
    const baseNotes = String(notes || "").trim();
    const duePattern = /Payment due in \d+ days\.?/i;
    if (!baseNotes) return dueMessage;
    if (duePattern.test(baseNotes)) {
      return baseNotes.replace(duePattern, dueMessage);
    }
    const separator = baseNotes.endsWith(".") ? " " : ". ";
    return `${baseNotes}${separator}${dueMessage}`;
  }

  function lineTotal(it, ccy = "EUR") {
    const qty = Number(it.qty || 0);
    const unit = Number(it.unit_price || 0);
    const base = roundMoney(qty * unit, ccy);
    const taxRate = Number(it.tax_rate || 0);
    const tax = roundMoney(base * taxRate, ccy);
    return { base, tax, gross: base + tax };
  }

  function defaultInvoiceNumber() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const seq = "0001";
    return `EU-${year}-${month}-${seq}`;
  }

  function computeTotals(doc) {
    const items = doc.line_items || [];
    let sub = 0, tax = 0;
    for (const it of items) {
      const t = lineTotal(it, doc.invoice?.currency || "EUR");
      sub += t.base;
      tax += t.tax;
    }
    const discount = Number(doc.totals?.discount || 0);
    const shipping = Number(doc.totals?.shipping || 0);
    const afterDiscount = sub - discount;
    const grand = afterDiscount + shipping + (doc.totals?.tax_included ? 0 : tax);
    const ccy = doc.invoice?.currency || "EUR";
    return Object.fromEntries(Object.entries({ sub, tax, discount, shipping, grand }).map(([k,v]) => [k, roundMoney(v, ccy)]));
  }

  function pickAccountNo(doc) {
    const bank = doc.seller?.bank || {};
    const ccy = (doc.invoice?.currency || "EUR").toUpperCase();
    if (ccy === "RSD") return bank.account_no_rsd || bank.account_no_eur || "";
    return bank.account_no_eur || bank.account_no_rsd || "";
  }

  function normalizeR18(account) {
    const raw = String(account || "").replaceAll(" ", "");
    const parts = raw.match(/^(\d{3})-(\d{1,13})-(\d{2})$/);
    const digits = parts ? parts[1] + parts[2].padStart(13, "0") + parts[3] : raw;
    if (!/^\d{18}$/.test(digits)) throw new Error("RSD account must have 18 digits or format 325-123456-78.");
    return digits;
  }

  function formatRsdForI(amountNumber) {
    // Tag I uses "RSD" + amount with comma decimal separator, no space. :contentReference[oaicite:2]{index=2}
    // Keep 2 decimals if needed; trim trailing zeroes allowed by spec (we keep 2 for sanity).
    const amt = Number(amountNumber || 0);
    const fixed = amt.toFixed(2); // "1234.50"
    const withComma = fixed.replace(".", ","); // "1234,50"
    // Remove trailing ",00" if you want ultra-minimal; spec allows omitting invalid decimal zeroes. :contentReference[oaicite:3]{index=3}
    // We'll keep them to reduce ambiguity in human display; scanners accept it.
    return "RSD" + withComma;
  }

  function buildIpsString(doc, totals) {
    // Core fields + sensible defaults for invoices:
    // K:PR V:01 C:1 R (18 digits) N (payee) I (amount) SF (payment code) S (purpose) RO (model+reference)
    // Mandatory tags: K, V, C, R, N, I, SF. :contentReference[oaicite:4]{index=4}
    const bank = doc.seller?.bank || {};
    const account = normalizeR18(bank.account_no_rsd);

    const payeeName = doc.seller?.company_name || "";
    const amount = totals.grand;

    // Default SF: 221 (final expenditure for goods/services) for business payments. :contentReference[oaicite:5]{index=5}
    const sf = String(doc.ips?.sf ?? "221").trim();

    // S: up to 35 chars recommended. :contentReference[oaicite:6]{index=6}
    const purpose = String(doc.ips?.s ?? "Usluge 3D dizajna i proizvodnje").trim().slice(0, 35);

    // RO: model + reference number (optional). Spec talks about leading 00 if no model. :contentReference[oaicite:7]{index=7}
    // We'll default to 00 + invoice number digits, lightly cleaned.
    const inv = String(doc.invoice?.number || "").replaceAll(" ", "");
    const roDefault = ("00" + inv).slice(0, 25);
    const ro = roDefault;

    const parts = [
      "K:PR",
      "V:01",
      "C:1",
      `R:${account}`,
      `N:${payeeName}`,
      `I:${formatRsdForI(amount)}`,
      `SF:${sf}`
    ];

    if (purpose) parts.push(`S:${purpose}`);
    if (ro) parts.push(`RO:${ro}`);

    return parts.join("|");
  }

  async function fetchIpsQrDataUrl(ipsString) {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const qr = qrcode(0, 'M');
    qr.addData(ipsString, 'Byte');
    qr.make();
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(qr.createSvgTag(4, 16));
  }

  async function render(docRaw) {
    validateInvoice(docRaw);
    const doc = deepMerge(DEFAULTS, docRaw);
    if (!doc.invoice?.number) {
      doc.invoice = { ...doc.invoice, number: defaultInvoiceNumber() };
    }

    // Apply branding
    document.documentElement.style.setProperty("--accent", doc.branding?.accent || "#8b1e1e");

    const seller = doc.seller || {};
    const buyer = doc.buyer || {};
    const bank = seller.bank || {};
    const ccy = (doc.invoice?.currency || "EUR").toUpperCase();

    const totals = computeTotals(doc);
    const accountNo = pickAccountNo(doc);

    const logo = doc.branding?.logo_path
      ? `<div class="logo"><img src="${esc(doc.branding.logo_path)}" alt="Euclidean Logo"></div>`
      : `<div class="logo"><span style="font-weight:900;color:var(--accent)">E</span></div>`;

    const issue = esc(doc.invoice?.issue_date || "");
    const due = esc(doc.invoice?.due_date || "");
    const invno = esc(doc.invoice?.number || defaultInvoiceNumber());
    const dueMessage = formatDueMessage(doc.invoice || {});
    const notesText = mergeNotesWithDue(doc.invoice?.notes || "", dueMessage);

    const items = (doc.line_items || []).map((it, idx) => {
      const lt = lineTotal(it, ccy);
      return `
        <tr>
          <td>${idx + 1}</td>
          <td class="desc">${esc(it.description || "")}</td>
          <td class="num">${esc(it.qty ?? "")} ${esc(it.unit || "")}</td>
          <td class="num">${money(it.unit_price, ccy)}</td>
          <td class="num">${money(lt.base, ccy)}</td>
        </tr>
      `;
    }).join("");

    // Payment/QR only for RSD
    const showIps = ccy === "RSD";
    const ipsString = showIps ? buildIpsString(doc, totals) : "";

    $("sheet").innerHTML = `
      <div class="top">
        <div class="brand">
          ${logo}
          <div>
            <h1 class="title">Invoice</h1>
            <div class="muted" style="font-size:13px;">${esc(seller.company_name || "")}</div>
          </div>
        </div>
        <div class="meta">
          <div><span class="k">Invoice #</span> <span class="v">${invno}</span></div>
          <div><span class="k">Issue Date</span> <span class="v">${issue}</span></div>
          <div><span class="k">Due Date</span> <span class="v">${due}</span></div>
        </div>
      </div>

      <div class="grid2">
        <div class="box">
          <h3>Seller</h3>
          <div class="line"><b>${esc(seller.company_name || "")}</b></div>
          ${(seller.address_lines || []).map(x => `<div class="line">${esc(x)}</div>`).join("")}
          ${seller.tax_id ? `<div class="line"><span class="muted">Tax ID:</span> ${esc(seller.tax_id)}</div>` : ``}
          ${seller.registration_id ? `<div class="line"><span class="muted">Registration ID:</span> ${esc(seller.registration_id)}</div>` : ``}
          ${seller.phone ? `<div class="line"><span class="muted">Phone:</span> ${esc(seller.phone)}</div>` : ``}
          ${seller.email ? `<div class="line"><span class="muted">Email:</span> ${esc(seller.email)}</div>` : ``}
          ${seller.website ? `<div class="line"><span class="muted">Website:</span> ${esc(seller.website)}</div>` : ``}
        </div>

        <div class="box">
          <h3>Buyer</h3>
          <div class="line"><b>${esc(buyer.company_name || "")}</b></div>
          ${(buyer.address_lines || []).map(x => `<div class="line">${esc(x)}</div>`).join("")}
          ${buyer.tax_id ? `<div class="line"><span class="muted">Tax ID:</span> ${esc(buyer.tax_id)}</div>` : ``}
          ${buyer.contact_name ? `<div class="line"><span class="muted">Attention:</span> ${esc(buyer.contact_name)}</div>` : ``}
          ${buyer.email ? `<div class="line"><span class="muted">Email:</span> ${esc(buyer.email)}</div>` : ``}
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:28px;">#</th>
            <th>Description</th>
            <th class="num">Qty</th>
            <th class="num">Unit Price</th>
            <th class="num">Amount</th>
          </tr>
        </thead>
        <tbody>
          ${items || `<tr><td colspan="5" class="muted">No line items.</td></tr>`}
        </tbody>
      </table>

      <div class="totals">
        <div class="totalsBox">
          <div class="totalsRow"><span class="muted">Subtotal</span><span>${money(totals.sub, ccy)}</span></div>
          ${totals.discount ? `<div class="totalsRow"><span class="muted">Discount</span><span>-${money(totals.discount, ccy)}</span></div>` : ``}
          ${totals.shipping ? `<div class="totalsRow"><span class="muted">Shipping</span><span>${money(totals.shipping, ccy)}</span></div>` : ``}
          ${(!doc.totals?.tax_included && totals.tax) ? `<div class="totalsRow"><span class="muted">Tax</span><span>${money(totals.tax, ccy)}</span></div>` : ``}
          <div class="totalsRow big"><span>Total</span><span>${money(totals.grand, ccy)}</span></div>
        </div>
      </div>

      <div class="footer">
        <div class="footerRow">
          <div class="footerLeft">
            <div class="box">
              <h3>Payment</h3>
              <div>
                ${bank.beneficiary ? `<div class="small"><span class="muted">Beneficiary:</span> ${esc(bank.beneficiary)}</div>` : ``}
                ${bank.bank_name ? `<div class="small"><span class="muted">Bank:</span> ${esc(bank.bank_name)}</div>` : ``}
                ${bank.iban ? `<div class="small"><span class="muted">IBAN:</span> ${esc(bank.iban)}</div>` : ``}
                ${bank.swift ? `<div class="small"><span class="muted">SWIFT/BIC:</span> ${esc(bank.swift)}</div>` : ``}
                ${accountNo ? `<div class="small"><span class="muted">Account:</span> ${esc(accountNo)}</div>` : ``}
                ${bank.bank_address ? `<div class="small"><span class="muted">Bank Address:</span> ${esc(bank.bank_address)}</div>` : ``}
                <div class="small"><span class="muted">Currency:</span> ${esc(ccy)}</div>
                ${!showIps ? `<div class="small muted" style="margin-top:8px;">IPS QR is generated only for RSD invoices.</div>` : ``}
              </div>
            </div>

            <div class="box">
              <h3>Notes</h3>
              <div class="small">${esc(notesText)}</div>
            </div>
          </div>

          <div class="box" aria-label="Payment QR">
            <h3>For your convenience</h3>
            ${showIps ? `
              <div class="qrBox">
                <img id="ipsQr" alt="IPS QR code" width="140" height="140" />
              </div>
              <div class="qrCaption">Scan To Pay</div>
              <div class="ipsString"><span class="pill">NBS IPS QR (RSD)</span></div>
              <div class="ipsString">${esc(ipsString)}</div>
            ` : `
              <div class="qrBox" style="color:var(--muted);font-size:11px;text-align:center;padding:12px;box-sizing:border-box;">
                No QR<br/>For ${esc(ccy)}
              </div>
            `}
          </div>
        </div>
      </div>
    `;

    if (showIps) {
      try {
        const qrImg = document.getElementById("ipsQr");
        qrImg.src = await fetchIpsQrDataUrl(ipsString);
        await qrImg.decode();
      } catch (e) {
        // If QR fails, show error inline (but don't break render)
        const err = document.createElement("div");
        err.className = "small";
        err.style.color = "#b00020";
        err.textContent = "QR generation failed: " + (e?.message || e);
        const qrBox = document.getElementById("ipsQr")?.parentElement;
        if (qrBox) {
          qrBox.replaceWith(err);
        }
      }
    }
  }

  function loadSample() {
    const today = new Date();
    const due = new Date(today); due.setDate(due.getDate() + 14);
    const localDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const sample = {
      invoice: {
        number: defaultInvoiceNumber(),
        issue_date: localDate(today),
        due_date: localDate(due),
        currency: "RSD",
        notes: "Thank you for your business."
      },
      buyer: {
        company_name: "Client Company Ltd",
        address_lines: ["Some Street 12", "11000 Belgrade", "Serbia"],
        tax_id: "",
        contact_name: "Someone",
        email: "ap@client.com"
      },
      line_items: [
        { description: "Game Development Services", qty: 1, unit: "Lot", unit_price: 300000, tax_rate: 0 }
      ],
      totals: { discount: 0, shipping: 0, tax_included: false },

      // Optional IPS overrides (defaults shown):
      ips: {
        sf: "221",
        s: "Usluge 3D dizajna i proizvodnje"
      }
    };

    $("json").value = JSON.stringify(sample, null, 2);
    render(sample).catch(e => { $("err").textContent = e.message; });
  }

  function safeParseJson() {
    $("err").textContent = "";
    try {
      return JSON.parse($("json").value);
    } catch (e) {
      $("err").textContent = String(e?.message || e);
      return null;
    }
  }

  function updateProtocolWarning() {
    const warning = $("protocolWarning");
    if (location.protocol === "file:") {
      warning.hidden = false;
      warning.textContent = "PDF export requires an HTTP server. You're currently using file://.\nRun something like `python -m http.server` and open http://localhost:8000/invoice.html.";
    } else {
      warning.hidden = true;
      warning.textContent = "";
    }
  }

  async function renderFromEditor(print = false) {
    $("err").textContent = "";
    $("renderBtn").disabled = $("pdfBtn").disabled = true;
    try {
      const obj = JSON.parse($("json").value);
      await render(obj);
      if (print) {
        await Promise.all([...$("sheet").querySelectorAll("img")].map(img => img.decode().catch(() => {})));
        document.title = "Invoice " + (obj.invoice?.number || defaultInvoiceNumber());
        window.print();
      }
    } catch (e) {
      $("err").textContent = "Cannot render invoice: " + (e.message || e);
      $("sheet").innerHTML = "";
    } finally {
      $("renderBtn").disabled = $("pdfBtn").disabled = false;
    }
  }
  $("renderBtn").addEventListener("click", () => renderFromEditor());
  $("sampleBtn").addEventListener("click", () => { $("err").textContent = ""; loadSample(); });
  $("pdfBtn").addEventListener("click", () => renderFromEditor(true));

  // Boot
  updateProtocolWarning();
  loadSample();
</script>
</body>
</html>
