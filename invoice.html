<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Euclidean Invoice Generator</title>

  <!-- libs for pdf + qr -->
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ajv@8.12.0/dist/ajv.min.js"></script>

  <style>
    :root {
      --accent: #a22a2a; /* Deep Euclidean-ish red */
      --accent2: rgba(139, 30, 30, 0.12);
      --muted: #666;
      --border: #e6e6e6;
      --bg: #fafafa;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background: var(--bg);
      color: #111;
    }

    .app {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      background: #fcfcfc;
    }

    .panel .content { padding: 12px 14px; }

    textarea {
      width: 100%;
      height: 420px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.35;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 650;
    }

    button.primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
    }

    button:active { transform: translateY(1px); }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }

    .error {
      color: #b00020;
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 10px;
    }

    /* Invoice sheet */
    .sheetWrap { padding: 12px; overflow: auto; }
    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 18px rgba(0,0,0,.06);
      padding: 18mm 16mm;
      box-sizing: border-box;
      position: relative;
    }

    /* The scar */
    .sheet::before {
      content: "";
      display: block;
      height: 3px;
      background: linear-gradient(to right, var(--accent), transparent);
      margin: -18mm -16mm 12mm -16mm;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .brand { display: flex; gap: 12px; align-items: center; }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 1px 10px rgba(0,0,0,.04);
    }

    .logo img { width: 100%; height: 100%; object-fit: contain; }

    .title {
      font-size: 24px;
      letter-spacing: .2px;
      margin: 0;
      color: var(--accent);
    }

    .meta { text-align: right; }
    .meta .k { color: var(--muted); font-size: 12px; }
    .meta .v { font-weight: 800; color: var(--accent); }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .box h3 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .box .line { font-size: 13px; line-height: 1.4; }
    .muted { color: var(--muted); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      vertical-align: top;
    }

    th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    td { font-size: 13px; }
    .num { text-align: right; white-space: nowrap; }
    .desc { width: 52%; }

    .totals { margin-top: 14px; display: flex; justify-content: flex-end; }

    .totalsBox {
      width: 72mm;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(to bottom, #fff, rgba(139,30,30,0.04));
    }

    .totalsRow {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
    }

    .totalsRow.big {
      font-weight: 900;
      font-size: 15px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 10px;
    }

    .totalsRow.big span:last-child { color: var(--accent); }

    .footer {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .small { font-size: 12px; line-height: 1.4; }

    .payGrid {
      display: grid;
      grid-template-columns: 1fr 92px;
      gap: 12px;
      align-items: start;
    }

    .qrBox {
      width: 92px;
      height: 92px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      display: grid;
      place-items: center;
    }

    .qrCaption {
      margin-top: 6px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(139,30,30,0.06);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    @media print {
      body { background: #fff; }
      .app { display: block; padding: 0; }
      .panel { display: none; }
      .sheetWrap { padding: 0; }
      .sheet {
        border: none;
        border-radius: 0;
        box-shadow: none;
        margin: 0;
        width: auto;
        min-height: auto;
        padding: 16mm 14mm;
      }
      .sheet::before {
        margin: -16mm -14mm 12mm -14mm;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h2>Invoice JSON</h2>
      <div class="content">
        <textarea id="json"></textarea>
        <div class="row">
          <button class="primary" id="renderBtn">Render</button>
          <button id="pdfBtn">Download PDF</button>
          <button id="sampleBtn">Load Sample</button>
        </div>
        <div class="hint">
          Notes: Seller + logo are hardcoded. PDF uses in-page rendering (no print dialog). IPS QR is generated for RSD only.
        </div>
        <div class="error" id="err"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Preview</h2>
      <div class="sheetWrap">
        <div class="sheet" id="sheet"></div>
      </div>
    </div>
  </div>

  <script type="module" src="invoice.renderer.js"></script>
</body>
</html>
